<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Bloco substituído por página no build (scripts/prerender.mjs) e atualizado na navegação (useSeo). -->
    <!--seo-->
    <title>Vinícius Celulares | Assistência Técnica no Jardim Ingá</title>
    <meta name="description" content="Vinícius Celulares — assistência técnica especializada em celulares, computadores, acessórios e eletrônicos. Reparo, manutenção e atendimento de confiança no Jardim Ingá." data-seo />
    <!--/seo-->
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Vinícius Celulares" />
    <meta name="apple-mobile-web-app-title" content="Vinícius Celulares" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script>
      // Esconde o HTML pré-renderizado até o React aplicar o estado inicial das animações (evita "piscar").
      document.documentElement.classList.add('js-hydrating');
    </script>
    <style>
      .js-hydrating #root { visibility: hidden; animation: reveal-root 0s 4s forwards; }
      @keyframes reveal-root { to { visibility: visible; } }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
